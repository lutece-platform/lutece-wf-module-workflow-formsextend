# {plugin.pluginName} properties file

#######################################################################################################
# Default Labels for XPage
workflow-formsextend.pageTitle=workflow-formsextend
workflow-formsextend.pagePathLabel=workflow-formsextend


# Limit email sender
workflow-formsextend.task.mass.notification.email.sending.limit=100

# Limit email sender
workflow-formsextend.task.mass.notification.dashboard.sending.limit=100

# Notification API endpoint
workflow-formsextend.notification_api.endpoint.addList=rest/notification-api/addList
workflow-formsextend.notification_api.rest.webapp.url=http://localhost:8080/lutece/

# User Cached attribute
workflow-formsextend.cacheuserattribute.attributeId.email=1

# Task type
workflow-formsextend.taskMassNotification.key=taskMassNotification
workflow-formsextend.taskMassNotification.titleI18nKey=module.workflow.formsextend.task_mass_notification.title
workflow-formsextend.taskMassNotification.beanName=workflow-formsextend.massNotificationTask
workflow-formsextend.taskMassNotification.configBeanName=workflow-formsextend.massNotificationTaskConfig
workflow-formsextend.taskMassNotification.configRequired=true
workflow-formsextend.taskMassNotification.formTaskRequired=true
workflow-formsextend.taskMassNotification.taskForAutomaticAction=true
